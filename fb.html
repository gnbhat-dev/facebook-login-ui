<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fb-login</title>
    <link rel="stylesheet" href="fb.css" type="text/css">
</head>
<body>
    <div class="page">
        <div class="left">
            <img src="logo.png" alt="Facebook">
            <p>Facebook helps you connect and share<br>with the people in your life.</p>
        </div>
        <div class="right">
            <div class="login-card">
                <form class="login-form">
                    <input type="text" placeholder="Email or phone number">
                    <input type="password" placeholder="Password">
                    <button type="submit" class="btn-login">Log in</button>
                    <a href="#" class="forgot">Forgotten password?</a>
                    <hr>
                    <button type="button" class="btn-create">Create new account</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
